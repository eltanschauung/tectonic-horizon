[package]
name = "tectonic-horizon"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "CC0-1.0"
description = "Tectonic terrain generation remade as a native Rust mod for Horizon"
repository = "https://github.com/eltanschauung/tectonic-horizon"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
